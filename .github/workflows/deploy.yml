name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
      - '.vscode/**'
  workflow_dispatch:

# Antrekan deploy, jangan cancel: rsync --delete yang terputus meninggalkan
# webroot setengah jadi.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Cache Astro/Vite build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .astro
            node_modules/.astro
            node_modules/.vite
          key: astro-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            astro-${{ hashFiles('bun.lock') }}-
            astro-

      - run: bun test
      - run: bunx --bun astro check
      - run: bun run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy dist/ to VPS
        run: |
          rsync -avz --delete --omit-dir-times --no-perms \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }}" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html/bagiberbagi/"
