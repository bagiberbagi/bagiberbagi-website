name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
      - '.vscode/**'
  workflow_dispatch:

# Antrekan deploy, jangan cancel: rsync --delete yang terputus meninggalkan
# webroot setengah jadi.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Cache Astro/Vite build artifacts
        uses: actions/cache@v6
        with:
          path: |
            .astro
            node_modules/.astro
            node_modules/.vite
          key: astro-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            astro-${{ hashFiles('bun.lock') }}-
            astro-

      - run: bun test
      - run: bunx --bun astro check
      - run: bun run build

      # Host key VPS diambil dari secret, bukan `ssh-keyscan` waktu run:
      # keyscan mempercayai kunci apa pun yang dijawab host saat itu
      # (trust-on-first-use tiap deploy), jadi runner yang di-MITM akan
      # menempelkan kunci penyerang lalu mengirim rsync ke sana. Secret
      # mengunci kunci yang sudah diverifikasi sekali di luar CI.
      # Isi ulang secret kalau host key VPS diputar:
      #   ssh-keyscan -p <port> <host> | gh secret set VPS_KNOWN_HOSTS
      # (verifikasi dulu lewat console provider, jangan percaya keyscan buta).
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Secret VPS_KNOWN_HOSTS kosong. Deploy dihentikan; jangan jatuh balik ke ssh-keyscan, itu menghapus jaminannya."
            exit 1
          fi
          printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy dist/ to VPS
        run: |
          rsync -avz --delete --omit-dir-times --no-perms \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=yes" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/html/bagiberbagi/"

      # rsync ke VPS tidak menyentuh edge cache Cloudflare: aset yang berubah
      # bisa tertahan berhari-hari dan terbaca seperti "deploy gagal". Purge
      # everything, bukan per-URL: nama file aset Astro ber-hash (otomatis
      # cache-miss), yang benar-benar butuh invalidasi justru path tetap
      # seperti HTML, favicon, robots.txt, dan sitemap.
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ZONE_ID belum diset — purge dilewati."
            exit 0
          fi
          response=$(curl -sS --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          echo "$response" | grep -q '"success":true' || {
            echo "::error::Purge Cloudflare gagal — deploy sudah masuk VPS, purge manual lewat dashboard."
            exit 1
          }
