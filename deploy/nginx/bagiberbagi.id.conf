# REFERENCE COPY. Deploy does not ship this file — the workflow only rsyncs
# dist/, and deploy/** sits in its paths-ignore. Applying it is a manual step,
# documented in deploy/RUNBOOK-infra-seo.md.
#
# The live file is NOT at the Debian-conventional sites-available path. This VPS
# keeps the real file in sites-enabled, so do not guess:
#   sudo nginx -T | grep 'configuration file .*bagiberbagi'
#
# The live copy also drifts from this one between manual applications. Always
# diff before editing it, never overwrite wholesale.
#
# THIS FILE IS THE TARGET, NOT WHAT IS LIVE RIGHT NOW. As of 4 Aug 2026 the
# origin still answers on port 80 only; port 443 is connection-refused. The TLS
# block below goes live through deploy/RUNBOOK-tls-origin.md, and it REQUIRES
# the two certificate files to exist on the VPS first. Copying this file up
# before generating them is safe but pointless: `nginx -t` fails on the missing
# ssl_certificate and refuses the reload, so the running config is untouched.

server {
    listen 80;
    listen [::]:80;

    # Both ports live in ONE server block on purpose. Splitting 443 into its own
    # block would duplicate every location and every add_header below, and the
    # two copies drift the first time only one of them gets edited.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name bagiberbagi.id www.bagiberbagi.id;

    # Cloudflare Origin CA certificate: 15 years, no renewal job to forget.
    # Trusted by Cloudflare ONLY, never by a browser, so the DNS records must
    # stay proxied (orange cloud). Grey-cloud one and anyone reaching this IP
    # directly gets a certificate warning.
    ssl_certificate     /etc/ssl/cloudflare/bagiberbagi.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/bagiberbagi.id.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # NO ssl_stapling, deliberately. An Origin CA certificate carries no OCSP
    # responder URL, so stapling only fills the error log with failed lookups.
    # Every generic nginx TLS guide tells you to switch it on; all of them
    # assume a publicly trusted certificate.
    #
    # NO Strict-Transport-Security either. Cloudflare already sends it
    # (max-age=15552000, set in the dashboard). Adding it here puts a second
    # copy on the wire with no way to keep the two values in step.
    #
    # NO redirect from 80 to 443. Cloudflare reaches this origin on port 80 for
    # as long as its encryption mode is Flexible, and a 301 to https would bounce
    # the browser to an edge that fetches port 80 again: an infinite loop. The
    # edge's own "Always Use HTTPS" is what moves visitors onto HTTPS, and it is
    # already on. Once Full (Strict) is confirmed, port 80 simply stops being
    # used rather than needing to be closed.

    root /var/www/html/bagiberbagi/;

    # Every route on this site is a directory (/faq/ -> /faq/index.html), so this
    # single line decides whether the site works at all. A one-character typo
    # here (index.htm) makes EVERY directory route return 403 while plain files
    # like /llms.txt keep returning 200 — the site looks half-alive and the
    # symptom points nowhere near this line. That happened on 4 Aug 2026.
    index index.html;

    client_max_body_size 20M;

    # nginx's automatic trailing-slash redirect (from try_files below, e.g.
    # /faq -> /faq/) emits an *absolute* Location built from $scheme. On a
    # request that arrived over port 80 that is "http", which downgrades an
    # HTTPS visitor to plain HTTP. absolute_redirect off makes nginx emit a
    # scheme-relative Location (just "/faq/") instead, so the browser keeps
    # whatever scheme it started with.
    #
    # Serving 443 does not retire this line: port 80 stays open and answers
    # exactly the same routes, so the downgrade path is still reachable.
    absolute_redirect off;

    # Belt-and-suspenders: rewrite any stray plain-HTTP subresource URLs to
    # HTTPS at the browser (harmless behind Cloudflare, protects direct hits).
    # Note this upgrades SUBRESOURCES only — it does nothing for a visitor who
    # reaches the document itself over http://. That gap is closed at the edge;
    # see deploy/RUNBOOK-infra-seo.md.
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # Stop browsers from second-guessing declared content types. Cheap, and the
    # only one of these headers with any chance of touching how a crawler reads
    # a response.
    add_header X-Content-Type-Options "nosniff" always;

    # Send the full URL to same-origin destinations, origin only to third
    # parties. Keeps referrer data useful in analytics without leaking the exact
    # jejak page a donor came from to outside sites.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version / Server header.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # Keystatic admin UI is a client-side-routed SPA; any sub-path under
    # /keystatic/ that isn't a real file falls back to its single built page.
    # ^~ forces this prefix match to win over any regex location below
    # (regex locations always take priority over plain prefix locations in
    # nginx otherwise, regardless of file order).
    location ^~ /keystatic/ {
        try_files $uri $uri/ /keystatic/index.html;
    }

    # Astro builds in directory format: each route is dist/<route>/index.html
    # (e.g. dist/faq/index.html for /faq), so the $uri/ step matches the
    # directory and nginx emits a scheme-relative 301 /faq -> /faq/. The
    # trailing $uri.html is a harmless fallback for any flat *.html output.
    #
    # HTML sent no Cache-Control at all, so Cloudflare fell back to its safest
    # assumption and cached nothing: every page returned cf-cache-status DYNAMIC
    # and each visitor waited for a round trip to this origin. On a fully static
    # site that is pure loss, and TTFB feeds straight into LCP.
    #
    # s-maxage lets the edge hold pages while max-age=0 keeps browsers checking,
    # so a deploy is visible immediately to anyone who reloads, and
    # stale-while-revalidate serves the old copy during the refresh instead of
    # making someone wait for it. Purging Cloudflare on deploy is still the
    # thing that makes a release instant for everyone; see the runbook.
    #
    # NGINX FOOTGUN, do not "tidy away" the repetition below: add_header is
    # inherited from the parent level ONLY when this level defines no add_header
    # at all. Adding one here switches off all three server-level headers for
    # every HTML response, which is exactly where they matter most. They are
    # therefore restated, and must be kept in step with the ones above.
    location / {
        try_files $uri $uri/ $uri.html =404;
        # No `always` here, deliberately: it would attach this to error
        # responses too, letting the edge cache a 404 for an hour, so a newly
        # published page would keep 404ing for visitors until that expired.
        # Without it nginx only sets the header on 2xx/3xx.
        add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400";
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Long-cache fingerprinted static assets.
    #
    # webp and avif were missing from this list, which mattered more than the
    # omission looks: every photo on the site is webp, so the largest assets
    # were the only ones NOT covered. They fell through to `location /` and took
    # Cloudflare's 4-hour default, expiring into revalidation round trips while
    # a stylesheet enjoyed 30 days. Filenames are content-hashed by Astro, so
    # immutable is safe and a year is the honest number: the URL changes
    # whenever the bytes do.
    # Server-level headers restated for the same reason as in `location /`
    # above. nosniff is the one that carries weight for static files.
    #
    # max-age is deliberately absent from add_header: the `expires` directive
    # emits it already, and stating it in both places makes max-age appear twice
    # inside one Cache-Control header. This split is inherited from the previous
    # config and is how it already behaves in production. On the wire the origin
    # sends two Cache-Control lines and the client joins them into
    # "public, max-age=31536000, immutable" — that is the expected shape, not a
    # bug.
    #
    # When verifying this after a reload, ask the ORIGIN, not Cloudflare:
    #   curl -sSI --resolve www.bagiberbagi.id:80:<origin-ip> http://www.bagiberbagi.id/_astro/<file>
    # Through the CDN you read whatever was cached under the OLD policy — a webp
    # kept reporting max-age=14400 with cf-cache-status HIT long after the config
    # was already correct, which reads exactly like a failed change.
    location ~* \.(css|js|svg|woff2?|jpg|jpeg|png|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Block dotfiles / secrets.
    location ~ /\.(env|envconfig|git|config) { deny all; return 404; }

    error_page 404 /404.html;
}
