server {
    listen 80;
    listen [::]:80;
    server_name bagiberbagi.id www.bagiberbagi.id;

    root /var/www/bagiberbagi.id;
    index index.html;

    # Cloudflare terminates TLS at the edge and proxies to this origin over
    # plain HTTP, so nginx's own $scheme is always "http" here. Without this,
    # nginx's automatic trailing-slash redirect (from try_files below, e.g.
    # /faq -> /faq/) emits an *absolute* Location: http://... header, which
    # downgrades HTTPS visitors to plain HTTP. `absolute_redirect off` makes
    # nginx emit a scheme-relative Location (just "/faq/"), so the browser
    # keeps whatever scheme it originally used.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Keystatic admin UI is a client-side-routed SPA; any sub-path under
    # /keystatic/ that isn't a real file falls back to its single built page.
    # ^~ forces this prefix match to win over any regex location below
    # (regex locations always take priority over plain prefix locations in
    # nginx otherwise, regardless of file order — bit us in production when
    # this config was merged into a shared-hosting template that had a
    # catch-all `location ~* { ... }` further down).
    location ^~ /keystatic/ {
        try_files $uri $uri/ /keystatic/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
