label: 46Cyclist
logo: /src/assets/organisasi/46cyclist.jpeg
summary: Komunitas sepeda resmi pegawai BNI (Bank Negara Indonesia) yang rutin berbagi bersama bagiberbagi.id.
detail:
  description: >-
    46Cyclist, juga dikenal sebagai Himovers Cyclist atau BNI 46Cyclist,
    adalah komunitas sepeda resmi para pegawai Bank Negara Indonesia (BNI).
    Selain rutin menggelar gowes bersama seperti fun bike dan party ride,
    komunitas ini aktif merayakan hari ulang tahun perusahaan dan komunitas
    lewat acara olahraga bersama, serta terlibat dalam aksi sosial dan
    berbagi kepada warga sekitar, termasuk mendukung penyaluran bantuan
    makanan bersama bagiberbagi.id.
